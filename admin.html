<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/png" href="/assets/Logo/Mazen%20page%20Logo.png"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1efeb"><title>Client accounts · Model Studio</title><link rel="stylesheet" href="model-studio.css"><style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#20232a;background:#e8ebf0}*{box-sizing:border-box}body{margin:0;min-height:100vh}.admin-header{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(18px,4vw,56px);border-bottom:1px solid #d4d8df}.admin-header a{color:inherit;text-decoration:none}.admin-brand{font-size:12px;font-weight:700;letter-spacing:.12em}.admin-main{width:min(960px,calc(100% - 32px));margin:42px auto}.admin-title{margin:0 0 8px;font-family:Georgia,serif;font-size:34px;font-weight:500}.admin-subtitle{color:#727985;font-size:14px}.admin-card{margin-top:26px;padding:24px;border-radius:18px;background:#e8ebf0;box-shadow:8px 8px 18px #c4c9d1,-8px -8px 18px #fff}.client-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:650}.field input{width:100%;height:42px;padding:0 11px;border:0;border-radius:9px;background:#e8ebf0;box-shadow:inset 3px 3px 6px #c4c9d1,inset -3px -3px 6px white;font:inherit}.field small{display:block;margin-top:6px;color:#727985;font-size:11px}.form-actions{grid-column:1/-1;display:flex;gap:10px}.admin-button{min-height:40px;padding:0 16px;border:0;border-radius:10px;background:#e8ebf0;color:#20232a;font:inherit;font-size:12px;font-weight:650;cursor:pointer;box-shadow:4px 4px 9px #c4c9d1,-4px -4px 9px white}.admin-button:hover{transform:translateY(-1px)}.admin-button.danger{color:#9d3028}.clients-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.clients-heading h2{margin:0;font-family:Georgia,serif;font-weight:500}.client-list{margin-top:18px}.client-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px 0;border-top:1px solid #d4d8df}.client-name{font-weight:650}.client-email{margin-top:4px;color:#727985;font-size:12px}.client-actions{display:flex;gap:8px}.client-actions .admin-button{min-height:34px}.notice{min-height:20px;margin:14px 0 0;color:#9d3028;font-size:13px}.notice:empty{display:none}.empty-list{padding:20px 0;color:#727985;font-size:13px}@media(max-width:600px){.client-form{grid-template-columns:1fr}.form-actions{grid-column:auto}.admin-card{padding:18px}.client-row{grid-template-columns:1fr}.client-actions{justify-content:flex-start}}
</style></head><body><header class="admin-header"><a href="/" class="admin-brand">MODEL STUDIO</a><a href="/admin-projects.html">Manage projects</a><a href="/">Back to studio</a></header><main class="admin-main"><h1 class="admin-title">Client accounts</h1><p class="admin-subtitle">Add clients and manage who can sign in to the studio.</p><section class="admin-card"><div class="clients-heading"><h2 id="formTitle">Add a client</h2><button id="newClientButton" class="admin-button" type="button" hidden>＋ New client</button></div><form id="clientForm" class="client-form" autocomplete="off"><input id="clientId" type="hidden"><div class="field"><label for="clientName">Client name</label><input id="clientName" name="name" maxlength="100" required></div><div class="field"><label for="clientUsername">Client ID / username</label><input id="clientUsername" name="clientId" type="text" minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,31}" required></div><div class="field" style="grid-column:1/-1"><label for="clientPassword">Temporary password</label><input id="clientPassword" name="password" type="password" minlength="8" autocomplete="new-password"><small id="passwordHelp">At least 8 characters. Share this securely with the client.</small></div><div class="form-actions"><button id="saveClientButton" class="admin-button" type="submit">Add client</button><button id="cancelEditButton" class="admin-button" type="button" hidden>Cancel</button></div></form><p id="formNotice" class="notice" role="alert" aria-live="polite"></p></section><section class="admin-card"><div class="clients-heading"><h2>Current clients</h2><span id="clientCount"></span></div><div id="clientList" class="client-list" aria-live="polite"></div><p id="listNotice" class="notice" role="alert" aria-live="polite"></p></section></main><script src="admin.js" defer></script></body></html>
